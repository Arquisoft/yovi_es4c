# Puerto del gateway
server.port=${GATEWAY_PORT:8080}

# URLs de los microservicios
# En producción se sobreescriben con variables de entorno (DEPLOY_HOST del workflow)
gateway.users.url=${USERS_SERVICE_URL:http://users:3000}
gateway.gamey.url=${GAMEY_SERVICE_URL:http://gamey:4000}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
-e 
# CORS — set to your HTTPS frontend origin in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# JWT — debe coincidir exactamente con el secret del auth-service
# En producción, inyectar como variable de entorno segura (secreto mínimo 32 chars)
jwt.secret=${JWT_SECRET:pon-aqui-un-secreto-aleatorio-de-al-menos-32-caracteres}
