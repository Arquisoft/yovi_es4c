# nginx.conf — servidor de producción para la webapp
# Proxy HTTP al gateway (8080) y WebSocket al ws-server (8081)
# Todo sale por el puerto 80, sin necesidad de exponer puertos extra al cliente.

server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Archivos estáticos de la SPA ────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy HTTP → gateway (REST API: users, games, gamey) ────────────────
    location /api/ {
        proxy_pass         http://gateway:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass         http://gateway:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /login {
        proxy_pass         http://gateway:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    location /createuser {
        proxy_pass         http://gateway:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    location /status {
        proxy_pass         http://gateway:8080;
        proxy_set_header   Host              $host;
    }

    # ── Proxy WebSocket → ws-server (salas multijugador) ───────────────────
    # El cliente conecta a ws://tudominio/ws
    # Nginx lo redirige al servicio ws-server:8081
    location /ws {
        proxy_pass             http://ws-server:8081;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     3600s;   # mantiene la conexión WS viva 1h
        proxy_send_timeout     3600s;
    }
}
