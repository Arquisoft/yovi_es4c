openapi: 3.0.0
info:
  title: API del Servicio de Usuarios
  version: 1.0.0
  description: API para la gestión de usuarios y registros de partidas

paths:

  /createuser:
    post:
      summary: Registrar un nuevo usuario
      description: Crea un nuevo usuario con la contraseña hasheada. Devuelve un error si el nombre de usuario ya está en uso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "testuser"
                password:
                  type: string
                  format: password
                  example: "secret123"
      responses:
        '200':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "¡Hola testuser! ¡Bienvenido al curso!"
        '400':
          description: Falta el nombre de usuario o la contraseña
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                faltaUsername:
                  value:
                    error: "el nombre de usuario es obligatorio"
                faltaPassword:
                  value:
                    error: "la contraseña es obligatoria"
        '409':
          description: Nombre de usuario ya en uso
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "El nombre de usuario ya está en uso"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /login:
    post:
      summary: Autenticar un usuario
      description: Valida las credenciales y devuelve el ID del usuario si son correctas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "testuser"
                password:
                  type: string
                  format: password
                  example: "secret123"
      responses:
        '200':
          description: Autenticación correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "¡Bienvenido de nuevo, testuser!"
                  userId:
                    type: integer
                    example: 1
        '400':
          description: Falta el nombre de usuario o la contraseña
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                faltaUsername:
                  value:
                    error: "el nombre de usuario es obligatorio"
                faltaPassword:
                  value:
                    error: "la contraseña es obligatoria"
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Usuario o contraseña incorrectos"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/games:
    get:
      summary: Obtener todas las partidas
      description: Devuelve la lista de todas las partidas guardadas, cada una con sus jugadores.
      responses:
        '200':
          description: Lista de partidas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 42
                    yen:
                      type: string
                      example: "[./. ./. . .]"
                    created_at:
                      type: string
                      format: date-time
                      example: "2024-01-15T10:30:00.000Z"
                    players:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          game_id:
                            type: integer
                            example: 42
                          user_id:
                            type: integer
                            nullable: true
                            example: 1
                          player_name:
                            type: string
                            example: "Alice"
                          is_winner:
                            type: boolean
                            example: true
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

    post:
      summary: Guardar una partida
      description: Guarda una partida finalizada con su cadena YEN y la lista de jugadores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - yen
                - players
              properties:
                yen:
                  type: string
                  description: Cadena YEN que representa el estado de la partida
                  example: "[./. ./. . .]"
                players:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "Alice"
                      userId:
                        type: integer
                        nullable: true
                        example: 1
                      isWinner:
                        type: boolean
                        example: true
            example:
              yen: "[./. ./. . .]"
              players:
                - name: "Alice"
                  userId: 1
                  isWinner: true
                - name: "Bob"
                  userId: 2
                  isWinner: false
      responses:
        '201':
          description: Partida guardada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  gameId:
                    type: integer
                    example: 42
        '400':
          description: Campos ausentes o inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "yen y players son obligatorios"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/games/seed:
    post:
      summary: Insertar partidas de ejemplo
      description: Inserta 5 partidas de ejemplo predefinidas en la base de datos. Útil para desarrollo y pruebas.
      responses:
        '201':
          description: Partidas de ejemplo insertadas correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Se han insertado 5 partidas de ejemplo correctamente"
                  gamesCreated:
                    type: integer
                    example: 5
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/users/{userId}/stats:
    get:
      summary: Estadísticas de un usuario
      description: Devuelve métricas de juego del usuario indicado (victorias, rachas, día favorito, etc.)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Estadísticas del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalGames:    { type: integer, example: 20 }
                  wins:          { type: integer, example: 12 }
                  losses:        { type: integer, example: 8 }
                  winRate:       { type: integer, example: 60 }
                  currentStreak: { type: integer, example: 3 }
                  topDay:        { type: string, nullable: true, example: "lunes" }
                  topDayCount:   { type: integer, example: 5 }
                  lastGame:      { type: string, format: date-time, nullable: true }
                  beatenBots:    { type: integer, example: 12 }
                  memberSince:   { type: string, format: date-time, nullable: true }
        '400':
          description: userId inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
              example:
                error: "Invalid userId"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /api/play:
    post:
      summary: Jugada completa (jugador + respuesta del bot)
      description: |
        Endpoint de alto nivel para competición entre bots o testing.
        Aplica la jugada del jugador, pide respuesta al bot y devuelve
        el estado tras ambas jugadas en una sola llamada.
        Si el jugador gana en su turno, bot_move será null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yen, coords, player_idx, bot_id]
              properties:
                yen:
                  type: object
                  description: Estado actual del juego en formato YEN
                  properties:
                    size:    { type: integer, example: 5 }
                    turn:    { type: integer, example: 0 }
                    players: { type: array, items: { type: string }, example: ["B","R"] }
                    layout:  { type: string, example: "./../.../..../....." }
                coords:
                  type: object
                  description: Coordenadas de la jugada del jugador (cúbicas)
                  properties:
                    x: { type: integer, example: 0 }
                    y: { type: integer, example: 0 }
                    z: { type: integer, example: 4 }
                player_idx:
                  type: integer
                  description: Índice del jugador que mueve (0 = Azul, 1 = Rojo)
                  example: 0
                bot_id:
                  type: string
                  description: Identificador del bot oponente
                  enum: [random_bot, greedy_bot, minimax_bot]
                  example: random_bot
            example:
              yen:
                size: 5
                turn: 0
                players: ["B","R"]
                layout: "./../.../..../....."
              coords: { x: 0, y: 0, z: 4 }
              player_idx: 0
              bot_id: random_bot
      responses:
        '200':
          description: Estado del juego tras ambas jugadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  yen:
                    type: object
                    description: Estado final del tablero
                  status:
                    type: string
                    enum: [Ongoing, Finished]
                    example: Ongoing
                  winner:
                    type: integer
                    nullable: true
                    description: Índice del ganador (0 o 1), null si sigue en curso
                    example: null
                  player_move:
                    type: object
                    description: Coordenadas aplicadas del jugador
                    properties:
                      x: { type: integer }
                      y: { type: integer }
                      z: { type: integer }
                  bot_move:
                    type: object
                    nullable: true
                    description: Coordenadas elegidas por el bot (null si el jugador ganó)
                    properties:
                      x: { type: integer }
                      y: { type: integer }
                      z: { type: integer }
        '400':
          description: Campos inválidos, jugada ilegal o YEN malformado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
              examples:
                camposFaltantes:
                  value: { error: "Missing required fields: yen, coords, player_idx, bot_id" }
                jugadaIlegal:
                  value: { error: "Illegal move" }
                yenInvalido:
                  value: { error: "Invalid YEN format" }
        '404':
          description: Bot no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
              example:
                error: "Bot not found: nonexistent_bot, available bots: [random_bot, greedy_bot, minimax_bot]"
        '502':
          description: Error de comunicación con el servicio de juego (gamey)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /api/leaderboard:
    get:
      summary: Ranking de usuarios
      description: Devuelve el ranking paginado de usuarios ordenado por victorias y winRate.
      parameters:
        - name: limit
          in: query
          required: false
          description: Número máximo de resultados (máx. 100, por defecto 20)
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          required: false
          description: Desplazamiento para paginación
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Ranking paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:        { type: integer, example: 1 }
                        userId:      { type: integer, example: 7 }
                        username:    { type: string, example: "Alice" }
                        gamesPlayed: { type: integer, example: 20 }
                        wins:        { type: integer, example: 15 }
                        winRate:     { type: number, example: 75.00 }
                  pagination:
                    type: object
                    properties:
                      total:  { type: integer, example: 42 }
                      limit:  { type: integer, example: 20 }
                      offset: { type: integer, example: 0 }
        '400':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
              example:
                error: "limit and offset must be integers"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /play:
    get:
      summary: Pedir jugada a un bot
      description: API unificada para la competición entre implementaciones. Recibe el estado del tablero y devuelve la jugada del bot.
      parameters:
        - name: position
          in: query
          required: true
          description: Estado del tablero en formato YEN (JSON string).
          schema:
            type: string
          example: '{"size":3,"turn":0,"players":["B","R"],"layout":"./B./..."}'
        - name: bot_id
          in: query
          required: false
          description: Identificador del bot oponente.
          schema:
            type: string
            default: random_bot
      responses:
        '200':
          description: Jugada elegida por el bot.
          content:
            application/json:
              schema:
                oneOf:
                  - description: Movimiento normal.
                    type: object
                    required: [coords]
                    properties:
                      coords:
                        type: object
                        required: [x, y, z]
                        properties:
                          x: { type: integer, example: 1 }
                          y: { type: integer, example: 1 }
                          z: { type: integer, example: 0 }
                  - description: Acción especial.
                    type: object
                    required: [action]
                    properties:
                      action:
                        type: string
                        enum: [swap, resign]
        '400':
          description: Parámetro position ausente o malformado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
              examples:
                faltaPosition:
                  value: { error: "Missing required query parameter: position" }
                jsonInvalido:
                  value: { error: "position must be a valid JSON string in YEN format" }
        '502':
          description: Error de comunicación con el servicio de juego
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }




