services:

  # ── TLS termination proxy ────────────────────────────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/app.conf:/etc/nginx/conf.d/app.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
      - webapp
      - ws-server
    networks:
      - monitor-net

  # ── API Gateway (Spring Boot) ────────────────────────────────────────────
  gateway:
    build: ./gateway
    container_name: gateway
    image: ghcr.io/arquisoft/yovi_es4c-gateway:latest
    expose:
      - "8080"
    environment:
      - USERS_SERVICE_URL=http://users:3000
      - GAMEY_SERVICE_URL=http://gamey:4000
    depends_on:
      - users
      - gamey
    networks:
      - monitor-net

  # ── Users service (Node.js) ───────────────────────────────────────────────
  users:
    build: ./users
    container_name: users
    image: ghcr.io/arquisoft/yovi_es4c-users:latest
    expose:
      - "3000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=secret
      - DB_NAME=yovi
    depends_on:
      - mysql
    networks:
      - monitor-net

  # ── WebSocket server ─────────────────────────────────────────────────────
  ws-server:
    build: ./webapp/ws-server
    container_name: ws-server
    image: ghcr.io/arquisoft/yovi_es4c-ws-server:latest
    expose:
      - "8081"
    environment:
      - WS_PORT=8081
    networks:
      - monitor-net

  # ── Webapp (React + Nginx) ────────────────────────────────────────────────
  webapp:
    build:
      context: ./webapp
      args:
        - VITE_API_URL=https://localhost
        - VITE_GAMEY_URL=https://localhost
        - VITE_WS_URL=wss://localhost/ws
    container_name: webapp
    image: ghcr.io/arquisoft/yovi_es4c-webapp:latest
    expose:
      - "80"
    depends_on:
      - gateway
      - ws-server
    networks:
      - monitor-net

  # ── Gamey service (Rust) ──────────────────────────────────────────────────
  gamey:
    build: ./gamey
    container_name: gamey
    image: ghcr.io/arquisoft/yovi_es4c-gamey:latest
    expose:
      - "4000"
    networks:
      - monitor-net

  # ── Monitoring ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./users/monitoring/prometheus:/etc/prometheus
    networks:
      - monitor-net

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=yovi
    volumes:
      - mysql-data:/var/lib/mysql
      - ./webapp/BDD/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - monitor-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    command:
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "9091:3000"
    volumes:
      - ./users/monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitor-net

networks:
  monitor-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local