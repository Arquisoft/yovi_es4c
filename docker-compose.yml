services:

  # ── TLS termination proxy ────────────────────────────────────────────────
  nginx:
    build: ./nginx
    image: ghcr.io/arquisoft/yovi_es4c-nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    networks:
      - monitor-net
    depends_on:
      - gateway
      - webapp
      - ws-server
      - swagger-ui

  # ── API Gateway (Spring Boot) ────────────────────────────────────────────
  gateway:
    build: ./gateway
    container_name: gateway
    image: ghcr.io/arquisoft/yovi_es4c-gateway:latest
    expose:
      - "8080"
    environment:
      - USERS_SERVICE_URL=http://users:3000
      - GAMEY_SERVICE_URL=http://gamey:4000
      - CORS_ALLOWED_ORIGINS=https://${DOMAIN:-localhost}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-local-no-usar-en-produccion}
    depends_on:
      - users
      - gamey
    networks:
      - monitor-net

  # ── Auth service (Node.js) ───────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    image: ghcr.io/arquisoft/yovi_es4c-auth-service:latest 
    container_name: auth-service
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - PORT=3001
      - USERS_SERVICE_URL=http://users:3000
      - JWT_SECRET=${JWT_SECRET:-dev-secret-local-no-usar-en-produccion}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
    depends_on:
      - users
    networks:
      - monitor-net

  # ── Users service (Node.js) ───────────────────────────────────────────────
  users:
    build: ./users
    container_name: users
    image: ghcr.io/arquisoft/yovi_es4c-users:latest
    expose:
      - "3000"
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=secret
      - DB_NAME=yovi
      - GAMEY_SERVICE_URL=http://gamey:4000
    depends_on:
      - mysql
    networks:
      - monitor-net

  # ── WebSocket server ─────────────────────────────────────────────────────
  ws-server:
    build: ./webapp/ws-server
    container_name: ws-server
    image: ghcr.io/arquisoft/yovi_es4c-ws-server:latest
    expose:
      - "8081"
    environment:
      - WS_PORT=8081
    networks:
      - monitor-net

  # ── Webapp (React + Nginx) ────────────────────────────────────────────────
  webapp:
    build:
      context: ./webapp
      args:
        - VITE_API_URL=https://${DOMAIN:-localhost}
        - VITE_GAMEY_URL=https://${DOMAIN:-localhost}
        - VITE_WS_URL=wss://${DOMAIN:-localhost}/ws
    container_name: webapp
    image: ghcr.io/arquisoft/yovi_es4c-webapp:latest
    expose:
      - "80"
    depends_on:
      - gateway
      - ws-server
    networks:
      - monitor-net

  # ── Gamey service (Rust) ──────────────────────────────────────────────────
  gamey:
    build: ./gamey
    container_name: gamey
    image: ghcr.io/arquisoft/yovi_es4c-gamey:latest
    expose:
      - "4000"
    networks:
      - monitor-net

  # ── Swagger UI — Documentación OpenAPI ───────────────────────────────────
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-ui
    expose:
      - "8080"
    environment:
      - SWAGGER_JSON=/openapi/openapi.yaml
      - BASE_URL=/docs
    volumes:
      - ./users/openapi.yaml:/openapi/openapi.yaml:ro
    networks:
      - monitor-net

  # ── Monitoring ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./users/monitoring/prometheus:/etc/prometheus
    networks:
      - monitor-net

  mysql:
    build: ./mysql
    image: ghcr.io/arquisoft/yovi_es4c-mysql:latest
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=yovi
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - monitor-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    command:
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "9091:3000"
    volumes:
      - ./users/monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitor-net

networks:
  monitor-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local