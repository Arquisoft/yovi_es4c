services:
  users:
    build: ./users
    container_name: users
    image: ghcr.io/arquisoft/yovi_es4c-users:latest
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=secret
      - DB_NAME=yovi
    depends_on:
      - mysql
    networks:
      - monitor-net

  webapp:
    build:
      context: ./webapp
      args:
        - VITE_API_URL=http://localhost:3000
        - VITE_GAMEY_URL=http://localhost:4000
    container_name: webapp
    image: ghcr.io/arquisoft/yovi_es4c-webapp:latest
    ports:
      - "80:80"
    depends_on:
      - users
    networks:
      - monitor-net

  gamey:
    build: ./gamey
    container_name: gamey
    image: ghcr.io/arquisoft/yovi_es4c-gamey:latest
    ports:
      - "4000:4000"
    networks:
      - monitor-net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./users/monitoring/prometheus:/etc/prometheus
    networks:
      - monitor-net

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=yovi
    volumes:
      - mysql-data:/var/lib/mysql
      - ./webapp/BDD/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - monitor-net
    deploy:
      resources:
        limits:
          memory: 512M  # Ajusta esto según tu RAM total (ej. 512MB o 756MB)
          cpus: '0.50'   # Limita al 50% de un núcleo de CPU
    command: 
      - --innodb-buffer-pool-size=256M # El valor por defecto es muy alto para una VM pequeña
      - --performance-schema=OFF        # Ahorra mucha RAM desactivando métricas internas

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "9091:3000"
    volumes:
      - ./users/monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitor-net
networks:
  monitor-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local
